# OPC UA robot source settings. No HTTP endpoint or token is needed.
telemetry_ms=5000
operating_every_s=60
alarms_every_s=30
extras_every_s=10
job_monitor_every_sample=1

# id,controller_ip,control_group,IO_byte_addresses_separated_by_semicolon
# Keep the existing robot ID when connecting this data to another system.
robot=1,192.168.255.1,R1,10;10010
