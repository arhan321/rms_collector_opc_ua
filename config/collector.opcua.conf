# Use the robot IPs and polling intervals from the existing robot configuration.
# API URL and token in robot_config are NOT used by this OPC UA executable.
robot_config=config/robots.opcua.conf

# Same PC as Ignition. For another PC, replace localhost with the collector PC IP.
endpoint=opc.tcp://localhost:4845/RMS/Collector
pki_dir=./pki-opcua
